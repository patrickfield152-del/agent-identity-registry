[build-system]
requires = ["setuptools>=84.2.1,<85", "wheel>=0.48.0,<0.49"]
build-backend = "setuptools.build_meta"

[project]
name = "skjold"
version = "0.5.0"
description = "skjold - NEAR-native AI agent identity and signed evidence tooling. did:near identity, W3C Verifiable Credentials, governance evidence, delegation chains, and reputation scoring."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
keywords = [
    "skjold",
    "ai-agents",
    "agent-identity",
    "attestation",
    "verifiable-credentials",
    "verifiable-presentations",
    "eu-ai-act",
    "mcp",
    "mcp-server",
    "did",
    "did-near",
    "ucan",
    "compliance",
    "ed25519",
    "near",
    "near-protocol",
    "gdpr",
    "reputation",
    "w3c",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Runtime dependencies are pinned with both lower and upper bounds to
    # prevent silent breakage from major-version drift (mcp 2.x, PyJWT 3.x,
    # cryptography 51.x, etc.) on fresh installs.
    # mcp >=1.30.0 closes the transport, OAuth and schema-validation advisories.
    "mcp[cli]>=1.30.0,<2.0.0",
    # cryptography >=50.0.0 closes the 44.x-49.x advisory flagged by Dependabot.
    "cryptography>=50.0.0,<51.0.0",
    # PyJWT >=2.15.0 closes CVE-2026-32597 (crit header validation bypass),
    # which affects the JWT / Verifiable Credential / UCAN verification paths.
    "PyJWT[crypto]>=2.15.0,<3.0.0",
    "anyio>=4.14.2,<5.0.0",
    "base58>=2.1.1,<3.0.0",
    "httpx>=0.28.0,<0.30.0",
    "python-dotenv>=1.1.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
    "python-json-logger>=3.3.0,<5.0.0",
    "filelock>=4.2.1,<5.0.0",
    # Use the current CA bundle security floor for transitive HTTP clients.
    "certifi>=2026.10.19",
    "click>=8.1.0,<9.0.0",
    # Transitive pin: mcp pulls python-multipart. Versions <0.0.26 are
    # vulnerable to CVE-2026-40347, exposed through both the MCP stdio server
    # and the FastAPI REST API's multipart uploads.
    "python-multipart>=0.0.26,<0.1.0",
]

[project.optional-dependencies]
# The REST API depends on FastAPI + uvicorn. Kept as an opt-in extra (not a
# base runtime dep) so callers who only need the MCP server or Python services
# do not get FastAPI dragged in.
api = ["fastapi>=0.130,<0.140", "uvicorn[standard]>=0.32,<0.40", "starlette>=1.3.1,<2.0"]
# Framework integration extras. The callback / adapter classes live under
# `attestix.integrations.<framework>` and import their SDK lazily so
# `import attestix.integrations` itself is always cheap.
langchain = ["langchain-core>=1.4.6,<2.0"]
crewai = ["crewai>=0.95,<0.200"]
openai-agents = ["openai-agents>=0.0.20"]
test = ["pytest>=8.0", "pytest-asyncio>=0.24", "respx>=0.22", "pytest-cov>=5.0"]
lint = ["ruff>=0.6.0", "mypy>=1.11"]
security = ["pip-audit>=2.7", "bandit>=1.7"]
# CycloneDX SBOM generation (runtime + transitive dependencies).
sbom = ["cyclonedx-bom>=5.0.0,<6.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "bandit>=1.7",
    "cyclonedx-bom>=5.0.0,<6.0.0",
    "build>=1.2",
    "setuptools>=84.2.1,<85",
    "wheel>=0.48.0,<0.49",
]

[project.scripts]
skjold = "attestix.cli:cli"

[tool.setuptools]
# The wheel ships the canonical `attestix.*` namespace only. The module path is
# retained; the distribution and console script are `skjold`.
packages = [
    "attestix",
    "attestix.api",
    "attestix.api.routers",
    "attestix.audit",
    "attestix.auth",
    "attestix.blockchain",
    "attestix.idempotency",
    "attestix.integrations",
    "attestix.integrations.langchain",
    "attestix.integrations.openai_agents",
    "attestix.integrations.crewai",
    "attestix.portability",
    "attestix.services",
    "attestix.signing",
    "attestix.storage",
    "attestix.tenancy",
    "attestix.tools",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Disable the Pydantic logfire plugin by default. When CrewAI (or other deps)
# pull in an opentelemetry-sdk version that is incompatible with the installed
# logfire, the plugin raises ImportError at collection time and aborts the
# whole suite. We do not need logfire for our tests.
addopts = "-p no:logfire"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "build",
    "dist",
    ".venv",
    "site",
    "attestix.egg-info",
]

[tool.ruff.lint]
# Keep initial rule set conservative so CI passes out of the box; expand later
# with `ruff check --fix` in a dedicated cleanup PR.
select = ["E", "F", "W"]
ignore = [
    "E501",  # line-length handled by formatter
    "E402",  # module level import not at top of file (dynamic path tweaks)
    "E701",  # multiple statements on one line (colon)
    "E702",  # multiple statements on one line (semicolon)
    "E722",  # bare except (legacy code has some)
    "E741",  # ambiguous variable name
    "F401",  # unused imports (re-exports in __init__ files)
    "F403",  # star imports
    "F405",  # may be undefined from star imports
    "F541",  # f-string without placeholders
    "F811",  # redefinition
    "F841",  # local variable assigned but not used
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811", "E402", "E401"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
warn_redundant_casts = true
# Keep mypy permissive initially; tighten over time.
check_untyped_defs = false
disallow_untyped_defs = false
exclude = [
    "build/",
    "dist/",
    "site/",
    "tests/",
]

[tool.bandit]
exclude_dirs = [
    "tests",
    "build",
    "dist",
    "site",
    ".venv",
]
skips = ["B101", "B311", "B404", "B603", "B607"]

[tool.coverage.run]
source = ["attestix"]
branch = true
omit = [
    "tests/*",
    "build/*",
    "dist/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.setuptools.package-data]
# Only ship Python source files, never JSON data
"attestix.blockchain" = ["*.py"]

[tool.setuptools.exclude-package-data]
# Runtime data files are generated on first use - never ship them
"*" = [
    "identities.json",
    "compliance.json",
    "credentials.json",
    "delegations.json",
    "reputation.json",
    "provenance.json",
    "anchors.json",
    "*.json.bak",
    "*.json.tmp",
    "*.json.lock",
    ".signing_key.json",
    ".keypairs.json",
    ".blockchain_config.json",
    "*.log",
]
