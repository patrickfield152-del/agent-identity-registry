[package]
name = "skjold-registry"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "skjold registry: agent identity, credential, delegation, reputation, TEE and artifact anchors on NEAR"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
# W3-F2 adds the sandbox suite and its dev-dependencies:
# near-sandbox = "0.4.0", near-api = "0.8.7", cargo-near-build = "0.11.5".
