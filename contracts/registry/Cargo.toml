[package]
name = "skjold-registry"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "skjold registry: agent identity, credential, delegation, reputation, TEE and artifact anchors on NEAR"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
# W3-F2 sandbox suite (p0-security.md step 13). `near-sandbox` is the node
# harness, `near-api` the client and `cargo-near-build` the wasm builder; the
# test itself is Linux-gated because near-sandbox-rs ships Linux x86_64 and
# macOS ARM64 binaries only.
near-sandbox = "0.4.1"
near-api = "0.8.7"
cargo-near-build = "0.11.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Deployment-wasm size profile (docs.near.org/smart-contracts/anatomy/reduce-size).
# cargo-near applies wasm-opt size optimization on top; overflow-checks stays on so
# arithmetic traps instead of wrapping silently.
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
